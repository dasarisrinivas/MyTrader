#           - '192.168.1.100:8000'  # UPDATE: Your Mac mini IP
#         labels:
#           instance: 'mac-mini'
#           env: 'prod'
#     scrape_interval: 30s
#     scrape_timeout: 10s
#     metrics_path: '/metrics'
#
# Then reload Prometheus:
#   kubectl rollout restart deployment prometheus  # or however you restart it
