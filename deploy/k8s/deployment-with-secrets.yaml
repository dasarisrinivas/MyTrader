apiVersion: apps/v1
kind: Deployment
metadata:
  name: mytrader
  labels:
    app: mytrader
    version: v1
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: mytrader
  template:
    metadata:
      labels:
        app: mytrader
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: mytrader
        image: mytrader:latest  # UPDATE THIS with your registry
        imagePullPolicy: Always
        ports:
        - name: metrics
          containerPort: 8000
          protocol: TCP
        
        # Use ConfigMap for non-sensitive config
        envFrom:
        - configMapRef:
            name: mytrader-config
        
        # Use Secret for sensitive data
        env:
        - name: IBKR_HOST
          valueFrom:
            secretKeyRef:
              name: mytrader-secrets
              key: IBKR_HOST
              optional: true
        - name: IBKR_PORT
          valueFrom:
            secretKeyRef:
              name: mytrader-secrets
              key: IBKR_PORT
              optional: true
        - name: IBKR_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: mytrader-secrets
              key: IBKR_CLIENT_ID
              optional: true
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: mytrader-secrets
              key: TELEGRAM_BOT_TOKEN
              optional: true
        - name: TELEGRAM_CHAT_ID
          valueFrom:
            secretKeyRef:
              name: mytrader-secrets
              key: TELEGRAM_CHAT_ID
              optional: true
        
        # Optional: Add liveness/readiness probes using metrics endpoint
        livenessProbe:
          httpGet:
            path: /metrics
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /metrics
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        
        # Optional: Mount persistent volumes for data/logs
        # volumeMounts:
        # - name: data
        #   mountPath: /app/data
        # - name: logs
        #   mountPath: /app/logs
      
      # Optional: Image pull secrets for private registries
      # imagePullSecrets:
      # - name: regcred
      
      # Optional: Persistent volumes
      # volumes:
      # - name: data
      #   persistentVolumeClaim:
      #     claimName: mytrader-data
      # - name: logs
      #   persistentVolumeClaim:
      #     claimName: mytrader-logs
