# Tiered Drawdown Backtest Config — T1 fix (MAR 2026)
# =====================================================
# Identical to bt_baseline except:
#   peak_drawdown_action: "tiered"   (was "halt")
#   peak_drawdown_pct: 3.0           (activates drawdown_active at tier-1 level)
#   Tier 1 (-3%):  50% size, trading continues
#   Tier 2 (-5%):  25% size, confidence >= 0.80 required
#   Tier 3 (-7%):  full halt (replaces old -4% cliff)
#
# Backtest motivation:
#   Baseline shows PEAK_DRAWDOWN_LOCKOUT: 2606 bars blocked (55.7%)
#   Gate triggered Oct 8 2025 at -4.77% → halted ALL trading for 5 months
#   This config lets the strategy trade through the drawdown at reduced size
strategy:
  use_15m_strategy: true
  use_scoring_system: false
  ft_pb_stop_mult: 1.5
  ft_pb_target_mult: 1.0
  ft_max_hold_bars: 8
  ft_or_minutes: 30
  ft_or_break_max_per_day: 2
  ft_or_target_r: 1.0
  ft_adx_min: 18.0
  ft_adx_max: 45.0
  ft_ema_touch_pct: 0.0015
  ft_ema_touch_atr_mult: 0.0      # pct-only (same as baseline)
  ft_fixed_tp_points: 8.0
  ft_fixed_tp_points_ema9: 10.0
  ft_fixed_tp_points_trend: 12.0
  ft_fixed_sl_points: 6.0
  ft_fixed_sl_points_ema9: 8.0
  ft_fixed_sl_points_trend: 8.0
  ft_ema9_sl_atr_mult: 1.0
  ft_ema9_sl_floor_pts: 8.0
  ft_ema9_sl_ceiling_pts: 20.0
  ft_ema9_rr_ratio: 1.25
  ft_ema9_pb_enabled: true
  ft_ema9_pb_stop_mult: 1.2
  ft_ema9_pb_target_mult: 1.5
  ft_ema9_touch_pct: 0.0015
  ft_shorts_enabled: true
  ft_short_pb_stop_mult: 1.5
  ft_short_pb_target_mult: 1.0
  ft_short_or_target_r: 1.0
  ft_trend_cont_enabled: true
  ft_trend_cont_stop_mult: 1.0
  ft_trend_cont_target_mult: 2.0
  ft_trend_cont_adx_min: 25.0
  ft_trend_cont_ema9_pct: 0.003
  ft_trend_cont_max_per_day: 2
  ft_trend_cont_max_ext_pts: 30.0
  ft_trend_cont_gap_adx_min: 25.0
  ft_entry_start_hour: 0
  ft_entry_start_minute: 0
  ft_entry_end_hour: 23
  ft_entry_end_minute: 59
  rth_start_hour: 0
  rth_start_minute: 0
  rth_end_hour: 23
  rth_end_minute: 59

risk_gate:
  # ── Tiered drawdown (KEY CHANGE vs baseline) ──────────────────────
  peak_drawdown_enabled: true
  peak_drawdown_action: "tiered"     # was "halt" — now allows tier1/2 trading
  peak_drawdown_pct: 3.0             # drawdown_active fires at first tier (-3%)
  peak_drawdown_flatten_on_trigger: true   # still flatten at tier 3

  # Tier 1: -3% to -5%  → 50% size, all signals allowed
  peak_drawdown_tier1_pct: 3.0
  peak_drawdown_tier1_size_mult: 0.5

  # Tier 2: -5% to -7%  → 25% size, confidence >= 0.80 only
  peak_drawdown_tier2_pct: 5.0
  peak_drawdown_tier2_size_mult: 0.25

  # Tier 3: -7%+         → full halt (hard stop)
  peak_drawdown_tier3_pct: 7.0
