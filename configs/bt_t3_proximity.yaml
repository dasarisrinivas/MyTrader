# T3 Proximity Entry — MAR 2026
# ===============================
# Adds Signal A-prime (long) and D-prime (short): near-miss entries
# when price pulls back to within 0.3×ATR of the EMA21 touch band
# but doesn't fully touch it.  Active only in high-vol (ATR > 13).
#
# Motivation: 29+43 near-miss bars in Feb-Mar 2026 high-vol regime.
# Position size reduced to 70% (position_scaler=0.7 in metadata).
# Max 2 proximity entries per side per day.
#
# Backtest period (Feb 2025-Jan 2026): ATR < 13 for 83.5% of bars
# → proximity gate (ATR > 13) will rarely trigger → near-zero impact
# This is the correct null result: the feature targets the live regime.
strategy:
  use_15m_strategy: true
  use_scoring_system: false
  ft_pb_stop_mult: 1.5
  ft_pb_target_mult: 1.0
  ft_max_hold_bars: 8
  ft_or_minutes: 30
  ft_or_break_max_per_day: 2
  ft_or_target_r: 1.0
  ft_adx_min: 18.0
  ft_adx_max: 45.0
  ft_ema_touch_pct: 0.0015
  ft_ema_touch_atr_mult: 0.75     # High-vol path (Fix #6)
  # T2 regime boundaries
  ft_atr_very_low_threshold: 8.0
  ft_atr_high_threshold: 13.0
  ft_atr_extreme_threshold: 20.0
  # T3 proximity entry
  ft_proximity_enabled: true
  ft_proximity_gap_mult: 0.3       # near-miss = within 0.3×ATR of band
  ft_proximity_size_mult: 0.7      # 70% position size
  ft_proximity_sl_mult: 0.8        # tighter SL (80% of normal)
  ft_proximity_tp_mult: 0.8        # tighter TP (80% of normal)
  ft_proximity_max_per_day: 2      # max 2 per side per day
  ft_fixed_tp_points: 8.0
  ft_fixed_tp_points_ema9: 10.0
  ft_fixed_tp_points_trend: 12.0
  ft_fixed_sl_points: 6.0
  ft_fixed_sl_points_ema9: 8.0
  ft_fixed_sl_points_trend: 8.0
  ft_ema9_sl_atr_mult: 1.0
  ft_ema9_sl_floor_pts: 8.0
  ft_ema9_sl_ceiling_pts: 20.0
  ft_ema9_rr_ratio: 1.25
  ft_ema9_pb_enabled: true
  ft_ema9_pb_stop_mult: 1.2
  ft_ema9_pb_target_mult: 1.5
  ft_ema9_touch_pct: 0.0015
  ft_shorts_enabled: true
  ft_short_pb_stop_mult: 1.5
  ft_short_pb_target_mult: 1.0
  ft_short_or_target_r: 1.0
  ft_trend_cont_enabled: true
  ft_trend_cont_stop_mult: 1.0
  ft_trend_cont_target_mult: 2.0
  ft_trend_cont_adx_min: 25.0
  ft_trend_cont_ema9_pct: 0.003
  ft_trend_cont_max_per_day: 2
  ft_trend_cont_max_ext_pts: 30.0
  ft_trend_cont_gap_adx_min: 25.0
  ft_entry_start_hour: 0
  ft_entry_start_minute: 0
  ft_entry_end_hour: 23
  ft_entry_end_minute: 59
  rth_start_hour: 0
  rth_start_minute: 0
  rth_end_hour: 23
  rth_end_minute: 59
