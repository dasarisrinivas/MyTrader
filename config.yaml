    aggressive_caching: true
    
  # Rule engine relaxation
  rule_relaxation:
    circuit_breaker_threshold: 5
    evening_session_relaxation: 0.15
    low_vol_atr_floor: 0.05

# Autonomous Learning Configuration
autonomous:
  # Enable/disable autonomous learning features
  enabled: false  # Set to true to enable autonomous learning (CAUTION: test thoroughly first)
  
  # Daily analysis settings
  run_daily_analysis: true  # Run daily performance analysis
  daily_analysis_time: "18:00"  # Time to run daily analysis (after market close)
  
  # Parameter adjustment settings
  auto_apply_changes: false  # Automatically apply parameter changes (false = human approval required)
  require_human_approval: true  # Require human approval before applying changes
  auto_approve_threshold: 0.85  # Auto-approve changes with confidence >= 0.85 (if human approval disabled)
  
  # Safety constraints for parameter changes
  safety_constraints:
    # RSI thresholds
    rsi_buy_min: 20.0
    rsi_buy_max: 45.0
    rsi_sell_min: 55.0
    rsi_sell_max: 80.0
    
    # Sentiment thresholds
    sentiment_buy_min: -1.0
    sentiment_buy_max: 0.0
    sentiment_sell_min: 0.0
    sentiment_sell_max: 1.0
    sentiment_weight_min: 0.1
    sentiment_weight_max: 0.9
    
    # Risk management bounds
    stop_loss_min: 10.0
    stop_loss_max: 50.0
    take_profit_min: 15.0
    take_profit_max: 100.0
    
    # LLM confidence bounds
    min_confidence_min: 0.5
    min_confidence_max: 0.9
    
    # Max change per adjustment (20% = 0.20)
    max_parameter_change_pct: 0.20
  
  # Rollback settings
  enable_auto_rollback: true  # Automatically rollback on poor performance
  rollback_threshold_pnl: -500.0  # Rollback if P&L drops by this amount
  rollback_check_days: 1  # Days to evaluate after parameter change
  
  # Weekly review settings
  run_weekly_review: true  # Run weekly performance reviews
  weekly_review_day: "sunday"  # Day of week to run weekly review
  weekly_review_time: "20:00"  # Time to run weekly review
  apply_weekly_suggestions: false  # Apply weekly optimization suggestions
  
  # Reporting
  save_daily_reports: true  # Save daily analysis reports
  save_weekly_reports: true  # Save weekly review reports
  reports_retention_days: 90  # Keep reports for 90 days

# Hybrid Decision Architecture Configuration
# This section configures the D-engine (deterministic) + H-engine (LLM/RAG) architecture
# NOTE: Renamed from 'hybrid:' to 'hybrid_decision:' to avoid YAML duplicate key collision
hybrid_decision:
  # Master enable/disable
  enabled: true
  min_confidence_for_trade: 0.45  # STANDARDIZED: Now 0-1 scale (was 45 on 0-100 scale)
  # Level confirmation defaults
  level_confirmation_enabled: true
  level_confirm_proximity_pct: 0.30
  level_confirm_buffer_atr_mult: 0.10
  level_confirm_min_buffer_points: 0.0
  level_confirm_max_wait_candles: 6
  level_confirm_timeout_mode: "SOFT_PENALTY"
  level_confirm_timeout_penalty: 0.12
  
  # D-Engine (Deterministic) Configuration
  d_engine:
    # Indicator weights (must sum to ~1.0)
    rsi_weight: 0.25
    macd_weight: 0.25
    ema_weight: 0.25
    atr_weight: 0.15
    volume_weight: 0.10
    
    # RSI thresholds
    rsi_oversold: 30.0
    rsi_overbought: 70.0
    
    # EMA settings
    ema_fast: 9
    ema_slow: 20
    
    # ATR thresholds
    atr_min_threshold: 0.10
    atr_max_threshold: 90.0
    
    # Candidate threshold (minimum score to trigger H-engine)
    candidate_threshold: 0.55
    
    # Risk parameters
    atr_stop_mult: 3.0   # Widened from 2.0 to 3.0 (stops were too tight)
    atr_target_mult: 6.0 # Keep 2:1 R:R with wider stop
  
  # H-Engine (LLM + RAG) Configuration
  h_engine:
    # Rate limiting
    max_calls_per_hour: 10
    min_interval_seconds: 60
    
    # RAG settings
    top_k: 5
    
    # Cache settings
    cache_ttl_seconds: 300
  
  # Confidence Scoring (ALL VALUES IN 0-1 SCALE)
  confidence:
    # Weights for final confidence calculation
    weights:
      technical: 0.5  # D-engine score weight
      model: 0.3      # LLM confidence weight
      rag: 0.2        # RAG similarity weight
    
    # Thresholds (0-1 scale)
    threshold: 0.60           # Minimum final confidence to trade
    min_technical_score: 0.50 # Minimum D-engine score
    min_model_confidence: 0.40 # Minimum LLM confidence
    
    # Consensus mode
    require_consensus: true   # Require D-engine and H-engine agreement
  
  # Safety Controls
  safety:
    order_cooldown_minutes: 5
    max_orders_per_15min: 3
    emergency_pnl_drop_pct: 2.5
  
  # Dry-run mode (no real orders)
  dry_run: false

# AWS Bedrock Agents Configuration
# Multi-agent orchestration for trading decisions
aws_agents:
  # Master enable/disable
  enabled: true  # Set to true to enable AWS agent-based trading
  
  # Configuration source
  # If true, auto-loads from aws/config/deployed_resources.yaml
  # If false, uses the values below
  use_deployed_config: true
  config_path: "aws/config/deployed_resources.yaml"  # Path to deployed resources config
  
  # Manual configuration (used if use_deployed_config=false)
  region_name: "us-east-1"
  
  # Agent IDs (filled automatically from deployed_resources.yaml)
  agent_ids:
    data: ""  # Data Ingestion Agent (Agent 1)
    decision: ""  # Decision Engine Agent (Agent 2)
    risk: ""  # Risk Control Agent (Agent 3)
    learning: ""  # Learning Agent (Agent 4)
  
  # Agent Alias IDs (for versioned deployments)
  agent_alias_ids:
    data: ""
    decision: ""
    risk: ""
    learning: ""
  
  # S3 bucket for trade data
  s3_bucket: ""
  
  # Knowledge Base
  knowledge_base_id: ""
  
  # Step Functions ARNs
  step_functions:
    signal_flow: ""
    nightly_flow: ""
  
  # Orchestration settings
  use_step_functions: false  # Use Step Functions vs direct agent invocation
  
  # Agent invocation settings
  max_retries: 3
  timeout_seconds: 30
  
  # Rate limiting
  max_requests_per_minute: 20
  
  # Confidence thresholds (from agents)
  min_decision_confidence: 0.60
  min_risk_approval_threshold: 0.50
  
  # Trade execution settings
  apply_agent_decision: false  # Apply agent decisions to actual trading
  require_risk_approval: true  # Require Risk Agent approval for trades
  
  # Logging
  log_agent_responses: true
  log_to_s3: true

live_review:
  # Enable/disable live trading review
  enabled: true  # Set to false to disable scheduled reviews
  
  # Scheduling
  run_time: "18:00"  # Daily execution time (after market close)
  analysis_days: 3  # Number of recent days to analyze
  
  # Data source
  use_database: true  # true = use llm_trades.db, false = use CSV logs
  csv_log_path: "logs/trades.csv"  # Path to CSV trade logs (if use_database=false)
  
  # Report settings
  generate_json: true  # Generate JSON reports
  generate_markdown: true  # Generate human-readable markdown reports
  reports_dir: "reports/daily_reviews"  # Directory for daily review reports
  reports_retention_days: 90  # Keep reports for 90 days
  
  # AI insight generation
  enable_ai_insights: true  # Generate AI-powered insights
  insight_confidence_threshold: 0.6  # Minimum confidence for recommendations
  max_recommendations: 10  # Maximum number of recommendations per report
  
  # Email notifications (optional)
  send_email_notifications: false  # Send email after review
  email_recipients: []  # List of email addresses
  email_on_warnings_only: true  # Only send email if warnings detected
  
  # Integration with autonomous system
  feed_to_autonomous: false  # Feed insights to autonomous learning system
  auto_apply_recommendations: false  # Automatically apply recommendations (requires feed_to_autonomous=true)

# Telegram Notifications Configuration
telegram:
  # Enable/disable Telegram notifications
  enabled: true  # Set to true to enable Telegram alerts
  
  # Bot credentials (obtain from @BotFather on Telegram)
  bot_token: "8277270355:AAERK77ILK3R2-jJ79h9n0E83Gt4uA31CQE"  # Your Telegram Bot API token
  chat_id: "5524962877"  # Your Telegram chat/channel ID
  
  # Notification preferences
  notify_on_trade: true  # Send alert when trade is executed
  notify_on_signal: false  # Send alert when signal is generated (can be noisy)
  notify_on_error: true  # Send alert on trading errors/warnings

# Observability / Prometheus Metrics
observability:
  prometheus_enabled: true
  prometheus_addr: "0.0.0.0"
  prometheus_port: 8000
  env_label: "live"


# ── Gold Futures Strategy ──────────────────────────────────────────────────────
gold:
  enabled: true
  symbol: "MGC"           # MGC = Micro Gold (10 oz, $10/pt) — safe default
  exchange: "COMEX"
  currency: "USD"
  allow_gc: false         # Set true only when ready to trade full-size GC

  ibkr_host: "127.0.0.1"
  ibkr_port: 4001         # 4001 = live gateway (real market data); simulation gate blocks orders
  ibkr_client_id: 3       # Must not conflict with MES (1) or VIX feed (2)

  simulation: false       # LIVE — enabled Mar 24 2026 for end-to-end validation

  session:
    session_open_et: "08:20"
    session_close_et: "13:30"
    flatten_before_close_minutes: 10
    opening_range_minutes: 15
    no_trade_open_minutes: 3
    extended_hours_enabled: true
    news_lockout_windows_et: []
    # Phase 5 — session bucket boundaries (ET)
    bucket_overnight_start_et: "18:00"
    bucket_pre_comex_start_et: "03:00"
    bucket_comex_open_start_et: "08:20"
    bucket_midday_start_et: "10:30"
    bucket_pre_close_start_et: "12:00"

  indicators:
    warmup_bars: 60
    ema_fast: 9
    ema_slow: 21
    atr_period: 14
    adx_period: 14
    mtf_enabled: false
    # Phase 2 — regime quality gates
    ema_spread_min_ratio: 0.00015
    ema_slope_enabled: true
    ema_slope_lookback_bars: 3
    ema_slope_min_per_bar: 0.02
    price_structure_enabled: true
    price_structure_lookback_bars: 5

  entry:
    adx_trend_min: 20.0
    adx_trend_max: 55.0
    orb_enabled: true
    post_loss_cooldown_bars: 3
    # Phase 3 — anti-chase / extension guards
    pullback_max_vwap_extension_atr: 1.5
    pullback_max_ema_extension_atr: 1.25
    orb_max_extension_atr: 0.75
    orb_max_vwap_extension_atr: 1.5
    extended_hours_extension_strictness_mult: 0.7   # Tighten thresholds 30% during extended hours
    # Phase 4B — direction-aware cooldowns
    post_loss_same_family_cooldown_bars: 6   # Block same signal family for longer after loss
    post_loss_opposite_cooldown_bars: 1       # Minimal cooldown for opposite-direction entries

  exit:
    atr_sl_multiplier: 1.5
    atr_tp_multiplier: 2.5
    trailing_stop_enabled: true
    time_stop_bars: 60
    # Phase 4A — progress-aware staged time stop
    time_stop_stage_1_bars: 20
    time_stop_stage_1_min_progress_r: 0.25   # Require 0.25R after 20 bars
    time_stop_stage_2_bars: 40
    time_stop_stage_2_min_progress_r: 0.0    # Require break-even after 40 bars

  risk:
    max_risk_per_trade_usd: 50.0
    daily_loss_limit_usd: 200.0
    max_trades_per_day: 1
    max_consecutive_losses: 3
    post_loss_cooldown_minutes: 30
    max_contracts_hard_cap: 1

