# AWS Bedrock LLM Integration (Optional)
llm:
  # Enable/disable LLM enhancement
  enabled: false  # TEMPORARILY DISABLED - LLM was blocking all trades (too conservative)
  
  # AWS Bedrock settings
  model_id: "anthropic.claude-3-sonnet-20240229-v1:0"  # or "anthropic.claude-3-haiku-20240307-v1:0" for faster/cheaper
  region_name: "us-east-1"
  max_tokens: 2048
  temperature: 0.3  # Lower = more deterministic (0.0-1.0)
  
  # Trade advisor settings
  min_confidence_threshold: 0.60  # ADJUSTED: Lowered from 0.75 to allow medium-confidence signals (0.65) during volatile markets
  override_mode: false  # false = consensus mode, true = LLM can override traditional signals
  call_interval_seconds: 60  # Minimum seconds between LLM calls (to avoid rate limits)
  
