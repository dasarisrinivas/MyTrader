  reddit_weight: 0.45      # Meme/retail momentum (WSB, r/stocks) (was 0.3)
  twitter_weight: 0.0      # DISABLED - no API credentials configured
  twitter_enabled: false   # Explicitly disable Twitter fetching
  
  # ============================================================
  # API Configuration
  # ============================================================
  refresh_interval_seconds: 300  # Refresh every 5 minutes (minimum)
  request_timeout_seconds: 3.0   # HTTP timeout per request (fail fast)
  
  # Stocktwits symbols to track
  stocktwits_symbols:
    - "ES_F"
    - "SPY"
  
