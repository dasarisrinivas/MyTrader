    - "options"
  reddit_search_terms:
    - "SPY"
    - "SPX"
    - "ES"
    - "S&P 500"
    - "futures"
  
  # Twitter/X search terms
  twitter_search_terms:
    - "$SPY"
    - "SPX"
    - "ES futures"
    - "S&P 500"
  
  # ============================================================
  # RTH Thresholds (Regular Trading Hours: 8:30 AM - 3:00 PM CT)
  # Higher liquidity = more relaxed thresholds
  # ============================================================
  entry_block_threshold: 0.30    # MAR 16 2026: Lowered from 0.40 → 0.30. Catches moderate bearish days (e.g. Mar 16 at −0.29 which was only REDUCE_SIZE, not BLOCK).
  weak_threshold: 0.15           # MAR 16 2026: Lowered from 0.20 → 0.15 proportionally.
  strong_exit_threshold: 0.6     # Tighten stop if sentiment reverses strongly
  
  # ============================================================
  # Low-Volume Session Thresholds (Evening & Overnight)
  # Lower liquidity = slightly stricter thresholds
  # Evening: 5:00 PM - 11:00 PM CT
  # Overnight: 11:00 PM - 8:30 AM CT
  # MAR 9 2026: Relaxed to allow overnight trading. Was blocking ALL signals.
  # ============================================================
  low_volume_entry_block_threshold: 0.35  # Relaxed from 0.25 → 0.35
  low_volume_weak_threshold: 0.15         # Relaxed from 0.10 → 0.15
  
  # ============================================================
  # Confidence Modifiers
  # ============================================================
  mild_contradiction_confidence_mult: 0.7   # 30% reduction for REDUCE_SIZE
  agreement_confidence_mult: 1.1            # 10% boost when sentiment agrees
  low_volume_confidence_penalty: 0.95       # MAR 9: Relaxed from 0.90 → 0.95

# ============================================================
# VX FUTURES FEED (REAL-TIME VIX FROM IBKR)
# Provides volatility-based position sizing multiplier
# Requires CFE Enhanced (NP,L1) market data subscription
# ============================================================
vix_feed:
  enabled: true  # Enable VX futures feed from IBKR
  
  # Connection settings (uses separate client_id to avoid conflicts)
  ib_host: "127.0.0.1"
  ib_port: 4001           # Must match data.ibkr_port (4001 for IB Gateway LIVE)
  client_id: 71           # Unique client ID for VX feed
  market_data_type: 1     # 1=live, 3=delayed (requires CFE subscription for live)
  
  # Stale data handling
  stale_seconds: 120               # Data considered stale after 2 minutes
  conservative_on_stale: false     # If true, use 0.5 multiplier when stale
  
  # Volatility multiplier thresholds
  # VX >= extreme -> 0.4 (reduce positions significantly)
  # VX >= elevated -> 0.7 (be cautious)
  # VX < elevated -> 1.0 (normal sizing)
  thresholds:
    extreme: 30.0          # VX >= 30: 40% of normal size (panic/crisis)
    elevated: 20.0         # VX >= 20: 70% of normal size (uncertainty)
  
  # Reconnection settings
  max_retries: 5
  base_delay: 1.0
  max_delay: 60.0

