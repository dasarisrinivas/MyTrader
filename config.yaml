    # CALL_SWEEP execution-validation pilot (2026-07-31). Purpose is measuring
    # real fill quality/slippage/latency, NOT profit. 1 position at a time so
    # every fill is independently attributable; 2 trades/day is the cap-sweep
    # optimum for EV/trade (cap1 $69.84, cap2 $71.34, cap3 $38.70, cap5 $22.27).
    max_open_positions: 1
    max_trades_per_day: 2
    daily_loss_limit_usd: 300.0      # realized; halts new entries
    max_consecutive_stopouts: 2      # halts new entries for the day

    # Bracket geometry: stop uses the signal's IV-adjusted % (15/20/25 by
    # IVR band); TP +40% → reward:risk ~1.6-2.6:1, breakeven WR ~38-45%.
    stop_pct_fallback: 25.0
    take_profit_pct: 40.0
    stop_type: "stop_limit"          # "stop" = market stop (guaranteed exit, worse fills)
    stop_limit_buffer_pct: 10.0

    # Strict quality gate
    # MEDIUM added 2026-07-31: the confidence tier is INVERTED for CALL_SWEEP —
    # Spearman(confidence, realized P&L) = -0.232, p<0.0001 OOS (n=445, 18
    # sessions, 100% replay completeness). HIGH/EXTREME population EV -$4.40
    # (n=10, 30% win) vs all-qualified +$12.48. Restricting to HIGH/EXTREME was
    # selecting the WORST signals. This is removal of a proven-harmful filter,
    # not a relaxation. Containment: only families at governor tier >= pilot can
    # size >= 1 contract; CALL_SWEEP is the sole such family (verified
    # 2026-07-31 — PC_AFTERNOON_FLOW demoted to experimental the same day).
    allowed_tiers: ["HIGH", "EXTREME", "MEDIUM"]
    require_green_edge: true
    max_dte: 3                    # 3 accommodates Fri→Mon weekend gap (2 trading days = 3 cal)
    min_abs_delta: 0.30
    max_abs_delta: 0.70
    max_entry_spread_pct: 5.0
    min_premium: 0.30
    max_premium: 8.0
    skip_event_risk: true

    # Timing guards
    no_new_entries_after_et: "15:00"
    flatten_0dte_at_et: "15:50"
    entry_timeout_s: 180
    max_hold_minutes: 90

  # ── Exit Engine v2 (JUL 14 2026, docs/SPY_EXIT_ENGINE_DESIGN.md) ──────
  # Confirmation-based multi-stage exits replacing the legacy one-trigger
  # full-close logic. shadow_mode=false → the engine DRIVES live exits
  # (activated JUL 14 for the JUL 15 session — evaluate at EOD).
  # Instant revert: set shadow_mode: true (legacy triggers resume; engine
  # goes back to log-only). All weights/thresholds default from
  # SpyOptionsExitEngineConfig; override here only when re-tuning.
  exit_engine:
    enabled: true
    shadow_mode: false

