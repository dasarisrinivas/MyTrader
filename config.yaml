  ft_trend_cont_long_enabled: true    # ✅ keep — only signal with positive live edge
  ft_trend_cont_short_enabled: false  # ❌ DISABLED (Fix #6, May 12 2026): 0/5 WR, -$304
  ft_trend_cont_stop_mult: 1.0        # Tighter stop (1.0 × ATR) — trend has momentum
  ft_trend_cont_target_mult: 2.0      # (LEGACY — superseded by fixed-point TP)
  ft_trend_cont_adx_min: 25.0         # Minimum ADX (FEB 24: raised from 18→25; 224-trade backtest: ADX<25 = −$1,582)
  ft_trend_cont_ema9_pct: 0.003       # EMA9 proximity tolerance (0.3%)
  ft_trend_cont_max_per_day: 2        # Max 2 fires per day per side
  # FEB 20 2026: Gap/extension handling — on gap-up/down days, 15m ATR is small
  # (~3 pts) but price may gap 20-30 pts above EMAs.  Old 1.5×ATR limit was ~4pts,
  # blocking all entries on gap days.  max_ext_pts sets an absolute ceiling;
  # gap_adx_min requires stronger trend when extension > 3×ATR.
  ft_trend_cont_max_ext_pts: 30.0     # Max pts from EMA9 allowed (handles gap days)
  ft_trend_cont_gap_adx_min: 25.0     # ADX required when extension > 3×ATR (extra safety)

  # MAR 10 2026: Signal G — London Momentum Breakout
  # During London session (2-5 AM CST / 8-11 AM GMT), MES sits in tight
  # range (ATR 2-4pts, ADX 16-18). European liquidity creates the first
  # directional impulse — Signal G captures it via EMA9/EMA21 crossover.
  # Historical London stats (165 sessions, Feb25-Jan26):
  #   Range: median=16.8pts, P25=11.4, P75=25.8
  #   Directional move: median=8.2pts, P25=4.4, P75=14.4
  # SL structural: max(floor, EMA21_gap+0.5), capped at ATR×1.0
  #   Floor=5pts — survives P25 wick action (11.4pt range ÷ 2 ≈ 5.7pt swing)
  # TP=8pts — hits in ~55-60% of sessions (above median 8.2)
  #   R:R = 8/5 = 1.6:1
  #   Max 1 per day (first impulse only)
  # MAY 12 2026 FIX #2: Disable Signal G (LONDON_MOMENTUM).
  # Reason: live data Feb 18 - May 7 2026 showed the London session as the
  # worst session by per-trade expectancy:
  #   * LONDON: n=10, 10% WR, -$246.26 (-$24.63/trade)
  # Signal G itself specifically: n=3, 33% WR, -$27.71 across 3 trades.
  # The bigger issue is that Signal G bypasses the entry-window gate set
  # in Fix #1 — it is checked at es_fifteen_min.py:621 BEFORE the gate.
  # So even with Fix #1 restricting entries to 9:30-16:00 ET, Signal G
  # would still fire during 02:00-05:00 CT (= 03:00-06:00 ET overnight).
  # Disabling here closes that bypass.  Re-enable only with a documented
  # London-specific backtest showing positive expectancy.
  ft_london_enabled: false            # ❌ DISABLED (Fix #2, May 12 2026)
  ft_london_start_hour: 2             # London window start (CT) — 8 AM GMT
  ft_london_start_minute: 0
  ft_london_end_hour: 5               # London window end (CT) — 11 AM GMT
  ft_london_end_minute: 0
  ft_london_adx_min: 15.0             # Lower ADX threshold (emerging from chop)
  ft_london_sl_points: 5.0            # SL floor (pts) — structural SL uses max(floor, EMA21_gap+0.5)
  ft_london_sl_atr_cap: 1.0           # SL ceiling = ATR × this mult (prevent over-wide SL on big bars)
  ft_london_tp_points: 8.0            # TP ($40) — ~55-60% hit rate (above median 8.2pt move); R:R 1.6:1
  ft_london_max_per_day: 1            # First impulse only — don't chase

  # MAY 12 2026 FIX #1: Restore entry window to RTH only (9:30-16:00 ET).
  # Reason: live data Feb 18 - May 7 2026 (n=56) showed:
  #   * 21 non-RTH trades (LONDON + OVERNIGHT): 9.5% WR, -$776
  #   * 12 early/late RTH trades (9:30-10:59, 15:xx): 42% WR, +$28
  #   * 23 midday RTH trades (11:00-14:59): 22% WR, -$601
  # The early-RTH bucket (9:30-10:59) was the strongest pocket — 45% WR,
  # +$68 over 11 trades, including BOTH TREND_CONT_LONG winners (+$238).
  # The Feb 18 2026 "24-hour trading" change opened the bot to sessions
  # the backtest never validated; this restores RTH-only operation.
  # NOTE: the es_fifteen_min.py inline comment cites 11:00-14:59 as the
  # sweet spot based on an old backtest — live data contradicts this,
  # so we use full RTH instead.
  # NOTE: Signal G (LONDON_MOMENTUM) bypasses this gate; addressed in Fix #2.
  # NOTE: rth_start/end_hour below still wrong (midnight) — Fix #3 will
  # restore them so OR computes from 9:30-10:00 ET as designed.
  # JUL 4 2026: Re-opened to 24h per user request (overnight + Sunday-evening
  # trading). This is safe to do NOW because the root cause of the Feb-May
  # 24h failure is fixed in code: the Opening Range is anchored at CORE RTH
  # open (9:30 ET, es_fifteen_min.py) instead of rth_start_hour, so widening
  # the session no longer corrupts OR_HIGH/OR_LOW or the exhaustion guard.
  # Overnight protections remain active (SL x1.2 / TP x1.5 scaling, min RR 1.5,
  # RSI-extreme + MACD-divergence blocks, ATR floor, A/D overnight cap 1/side).
  # Revert to RTH-only: set entry 9:30-16:00 and rth window 9:30-16:00 below.
  ft_entry_start_hour: 0              # 00:00 ET — 24h entries (was 9 / 9:30 ET)
  ft_entry_start_minute: 0
  ft_entry_end_hour: 23               # 23:59 ET (was 16:00 ET)
  ft_entry_end_minute: 59
  # JUL 4 2026: Overnight signal-family allowlist. Outside core RTH
  # (9:30-16:00 ET) only these families may enter; all RTH behavior unchanged.
  # True-24h backtest (2025-05→2026-05): unrestricted overnight flipped the
  # year +$1,360 → −$641 (DD −31%); every overnight family was net-negative
  # EXCEPT EMA9_PB_LONG (+$96, n=27, 59% WR) — so only it is admitted.
  # Add families here to widen overnight; empty list [] = allow ALL overnight.
  ft_overnight_allowed_signals: ["EMA9_PB_LONG"]
  
  # MAY 12 2026 FIX #3: Restore RTH window to 9:30-16:00 ET (the strategy's
  # original design).  These values control TWO things in es_fifteen_min.py:
  #   1. The Opening Range collection window — first ft_or_minutes (30) of
  #      "RTH".  With rth_start_hour=0, the OR was being computed from
  #      00:00-00:30 ET every day (= 23:00-23:30 CT), so the OR_HIGH/OR_LOW
  #      used by Signals B/E (OR_BREAK_LONG/SHORT) and by the TREND_CONT
  #      exhaustion guard was meaningless overnight noise.  Live data shows
  #      OR_BREAK_LONG  n=5, 0% WR, -$197 ;  OR_BREAK_SHORT n=8, 12.5%, -$248.
  #      Hypothesis: a properly-placed OR will fix these signals or at least
  #      stop them being random.
  #   2. The "Must be within RTH" gate at line 658 of es_fifteen_min.py.
  #      Currently 00:00-23:59 (no-op).  Restoring to 9:30-16:00 makes this
  #      gate enforce RTH — redundant with Fix #1 (entry-window 9:30-16:00 ET)
  #      but the architecturally-correct behavior.  No behavioral regression.
  # NOTE: _core_rth_start/_core_rth_end (hardcoded time(9,30)/time(16,0) at
  # es_fifteen_min.py:318-319) was already correct, so overnight detection
  # for SL/TP scaling, ATR floors, and EMA21_PB per-session counters has
  # been quietly working from those.  Fix #3 affects ONLY the OR window
  # and the redundant RTH gate.
  # JUL 4 2026: Widened to 24h per user request. Unlike the Feb 18 change this
  # NO LONGER moves the Opening Range window — OR collection is anchored at
  # _core_rth_start (9:30 ET) in code as of JUL 4, so point 1 of the Fix #3
  # note above is obsolete. This window now controls only which bars the live
  # session gate + strategy evaluate. classify_session() keeps Saturday and
  # Sunday-before-18:00-ET as WEEKEND and 17:00-18:00 ET as MAINTENANCE, so
  # Sunday-evening Globex bars (18:00 ET reopen) become tradable.
  rth_start_hour: 0                   # session window open (ET) — was 9:30
