  min_training_trades: 100  # Minimum trades required for retraining
  
  # Database settings
  trade_log_db_path: "data/llm_trades.db"  # SQLite database for trade logging

# RAG (Retrieval-Augmented Generation) Configuration
rag:
  # Enable/disable RAG features
  enabled: false  # Safe default keeps RAG offline unless explicitly enabled
  backend: "local_faiss"  # off|local_faiss|opensearch_serverless|aurora_pgvector
  opensearch_enabled: false  # Hard kill switch for OpenSearch-backed KB

  # AWS Bedrock Embeddings settings
  embedding_model_id: "amazon.titan-embed-text-v1"  # Titan Embeddings model
  region_name: "us-east-1"
  
  # Vector store settings
  vector_store_path: "data/rag_index"  # Path to persist FAISS index
  embedding_dimension: 1536  # Titan v1 embedding dimension
  
  # Retrieval settings
  top_k_results: 3  # Number of documents to retrieve
  score_threshold: 0.5  # Minimum similarity score (0-1)
  
  # Performance settings
  cache_enabled: true  # Enable query result caching
  cache_ttl_seconds: 3600  # Cache time-to-live (1 hour)
  batch_size: 10  # Number of documents to embed at once

  # Knowledge base
  knowledge_base_path: "data/knowledge_base"  # Directory for knowledge base documents
  local_store_path: "rag_data/local_kb/local_kb.sqlite"
  kb_cache_ttl_seconds: 120
  min_similar_trades: 0
  min_win_rate: 0.15
  min_similar_trades_for_full_threshold: 8  # Relax threshold until we have 8+ close matches
  min_weighted_win_rate: 0.3
  min_weighted_win_rate_soft_floor: 0.15  # Allow trades in thin regimes down to 15% weighted win rate
  min_sample_for_hard_block: 30
  soft_penalty_when_below: 0.1

