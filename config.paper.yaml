# Paper-trading overrides for ShreeBot.
#
# This file is intentionally minimal and should be loaded instead of `config.yaml`
# for paper sessions. It keeps paper/live separation explicit for IBKR connectivity,
# VX feed connectivity, and observability labels/ports.

data:
  ibkr_host: "127.0.0.1"
  ibkr_port: 4002  # IB Gateway PAPER trading (4002=paper, 4001=live)

vix_feed:
  ib_host: "127.0.0.1"
  ib_port: 4002   # Must match paper IB Gateway/TWS port
  client_id: 71
  market_data_type: 1

observability:
  prometheus_enabled: true
  prometheus_addr: "0.0.0.0"
  prometheus_port: 8001
  env_label: "paper"

trading:
  # MAR 23 2026: Keep paper-trading thesis-aware exit behavior aligned with live defaults.
  ft_thesis_reversal_exit_enabled: true
  ft_thesis_reversal_arm_profit_pts: 2.0
  ft_thesis_reversal_arm_stop_fraction: 0.35

# ── Gold paper-trading overrides ──────────────────────────────────────────────
# Mirror config.yaml gold: section except port → 4002 and simulation → true.
# All other fields (session, indicators, entry, exit, risk) inherit from
# config.yaml defaults.  Only override connectivity + mode here.
gold:
  enabled: true
  symbol: "MGC"
  exchange: "COMEX"
  currency: "USD"
  allow_gc: false

  ibkr_host: "127.0.0.1"
  ibkr_port: 4002          # Paper gateway
  ibkr_client_id: 3

  simulation: false         # Paper port handles safety — let orders flow to IB paper account

  session:
    session_open_et: "08:20"
    session_close_et: "13:30"
    flatten_before_close_minutes: 10
    opening_range_minutes: 15
    no_trade_open_minutes: 3
    extended_hours_enabled: true
    news_lockout_windows_et: []
    bucket_overnight_start_et: "18:00"
    bucket_london_open_start_et: "03:00"
    bucket_pre_comex_late_start_et: "05:00"
    bucket_comex_open_start_et: "08:20"
    bucket_midday_start_et: "10:30"
    bucket_pre_close_start_et: "12:00"

  indicators:
    warmup_bars: 60
    ema_fast: 9
    ema_slow: 21
    atr_period: 14
    adx_period: 14
    mtf_enabled: false
    ema_spread_min_ratio: 0.00015
    ema_slope_enabled: true
    ema_slope_lookback_bars: 3
    ema_slope_min_per_bar: 0.02
    price_structure_enabled: true
    price_structure_lookback_bars: 5

  entry:
    adx_trend_min: 20.0
    adx_trend_max: 55.0
    orb_enabled: true
    post_loss_cooldown_bars: 3
    pullback_max_vwap_extension_atr: 1.5
    pullback_max_ema_extension_atr: 1.25
    orb_max_extension_atr: 0.75
    orb_max_vwap_extension_atr: 1.5
    extended_hours_extension_strictness_mult: 0.7
    post_loss_same_family_cooldown_bars: 6
    post_loss_opposite_cooldown_bars: 1

  exit:
    atr_sl_multiplier: 1.5
    atr_tp_multiplier: 2.5
    trailing_stop_enabled: true
    time_stop_bars: 60
    time_stop_stage_1_bars: 20
    time_stop_stage_1_min_progress_r: 0.25
    time_stop_stage_2_bars: 40
    time_stop_stage_2_min_progress_r: 0.0

  risk:
    # 1 MGC contract with ATR-based SL (1.5×ATR × $10/pt) typically risks $120-180.
    # $50 was too conservative — forced min(1, floor(50/risk)) = 1 contract regardless,
    # but also showed misleading "within limit" logs when actual risk was 2-4× the cap.
    # Raised to $175 to match realistic 1-contract MGC paper risk while remaining
    # comfortably inside the $200 daily loss limit.
    max_risk_per_trade_usd: 175.0
    daily_loss_limit_usd: 200.0
    max_trades_per_day: 1
    max_consecutive_losses: 3
    post_loss_cooldown_minutes: 30
    max_contracts_hard_cap: 1

  # Paper-specific paths — keep live and paper data completely separate
  state_file: "data/paper_gold_state.json"
  orders_db: "data/paper_gold_orders.db"
  journal_dir: "data/paper_gold_journal"
  log_file: "logs/paper_gold_trading.log"

  # ── Telegram Notifications (copied from config.yaml, can be customized) ──
  telegram:
    enabled: true  # Set to true to enable Telegram alerts
    bot_token: "8277270355:AAERK77ILK3R2-jJ79h9n0E83Gt4uA31CQE"  # Your Telegram Bot API token
    chat_id: "5524962877"  # Your Telegram chat/channel ID
    notify_on_trade: true  # Send alert when trade is executed
    notify_on_signal: false  # Send alert when signal is generated (can be noisy)
    notify_on_error: true  # Send alert on trading errors/warnings

# ── SPY Options paper-trading overrides ───────────────────────────────────────
# Minimal overrides — all signal thresholds, external sources, and session
# gates inherit from config.yaml spy_options: defaults.  Only connectivity and
# storage paths differ for paper vs live.
spy_options:
  enabled: true

  ib:
    ibkr_host: "127.0.0.1"
    ibkr_port: 4002           # IB Gateway PAPER socket (4002=paper, 4001=live)
    ibkr_client_id: 5         # Same client-id as live; paper gateway is isolated
    snapshot_wait_s: 3.0
    greeks_wait_s: 4.0
    max_subscriptions: 60

  signals:
    # Paper config inherits all signal thresholds from config.yaml.
    # Override min_confidence here if you want looser paper-mode filtering:
    # min_confidence: 0.70
    confidence_tier_high: 0.70
    confidence_tier_extreme: 0.80

  analytics:
    enabled: true
    db_path: "data/paper_spy_options_signals.db"   # Separate DB from live signals

  external:
    # All external sources remain enabled so paper signals have full context.
    enabled: true
    composite_confidence_boost: 0.05

  rules_v2:
    enabled: true
    expected_move_gate_enabled: true

  telegram:
    enabled: true
    bot_token: "8252063184:AAHE_uiEcEqRaB1jfWvjGSjMsnbNfWluCfI"  # SPY options bot
    chat_id: "5524962877"

  log_file: "logs/paper_spy_options.log"
